services:
  # Backend FastAPI Service (Dockerized with Tesseract OCR pre-installed)
  - type: web
    name: document-summary-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: CORS_ORIGINS
        value: "*"
